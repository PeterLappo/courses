<ul>
<li><strong>£1.28 billion</strong> was lost to payment fraud in the UK in 2025</li>
<li><strong>85%</strong> of cyber attacks on businesses start with a scam email</li>
<li>Most scams don't need technical skill to stop. They need you to <strong>pause and check</strong>.</li>
</ul>
<p><small>Sources: UK Finance, 2025 figures; NCSC, Small organisations guide.</small></p>
<div class="more">
<p>Criminals rely on catching people when they're busy, distracted or worried. The tricks change, but the patterns repeat, and this course is about learning those patterns.</p>

<h2 id="email-phishing-how-it-works">Email phishing: how it works</h2>
<div class="cols"><div>
<ul>
<li>A fake email that looks like it's from your bank, a delivery firm, an energy company or Microsoft</li>
<li>It wants you to <strong>click a link</strong> to a fake login or payment page, or <strong>open an attachment</strong></li>
<li>The stolen details are used to take money, or to make a later &quot;bank&quot; call more convincing</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>Urgency or a threat: &quot;your account will be locked today&quot;</li>
<li>A refund or offer you weren't expecting</li>
<li>The sender's name looks right, but the <strong>address</strong> doesn't</li>
<li>&quot;Dear customer&quot; rather than your name</li>
<li>A link that takes you to a login page</li>
</ul>
<p><strong>Do this:</strong> don't click. Open the app, or type the website address yourself.<br />
Forward the email to <strong><a href="mailto:report@phishing.gov.uk">report@phishing.gov.uk</a></strong>.</p>
</div></div>
<div class="more">
<p>Poor spelling used to be the giveaway. It isn't any more: many phishing emails are well written. At work, fake Microsoft 365 sign-in pages are a common way into staff email accounts.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-%C2%A3199-parcel-email">Story: the £1.99 parcel email</h2>
<ul>
<li>A 79-year-old woman in Blackpool was <strong>expecting a parcel</strong>.</li>
<li>That day, an email &quot;from the courier&quot; asked for a <strong>£1.99 fee</strong> to deliver it. She paid.</li>
<li>She had second thoughts and <strong>checked with her bank</strong>. Her savings had gone: <strong>£5,000</strong>, plus <strong>£900</strong> from her current account.</li>
<li><strong>Missed:</strong> a fee demanded through an email link.</li>
<li><strong>What would have stopped it:</strong> tracking the parcel on the courier's own website.</li>
<li><strong>Good news:</strong> because she acted fast, her bank got the money back.</li>
</ul>
<p><small>Source: Blackpool Gazette, 2022 or later.</small></p>
<div class="more">
<p>Criminals time these emails to arrive when lots of people are expecting deliveries. Checking with the bank quickly is what saved her.</p>
</div>

<h2 id="business-email-compromise-how-it-works">Business email compromise: how it works</h2>
<div class="cols"><div>
<ul>
<li>Criminals take over, or imitate, the email of a <strong>supplier, a solicitor or a boss</strong></li>
<li>They send an invoice with <strong>new bank details</strong>, or an urgent request to pay</li>
<li>When people buy a house, the deposit is a favourite target</li>
<li>Newer versions use <strong>deepfake video or voice calls</strong></li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>&quot;Our bank details have changed&quot;</li>
<li>Pressure to pay today, or to keep it quiet</li>
<li>A sender address that's very slightly different</li>
<li>A request to skip the normal approval process</li>
</ul>
<p><strong>Do this:</strong> check any change of bank details by <strong>phoning a number you already know</strong>, never one in the email.</p>
</div></div>
<div class="more">
<p>In September 2025 alone, reported invoice-fraud victims in the UK lost an average of over £47,000 each. Because the email can come from the real account, a correct sender address doesn't prove it's safe.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-house-deposit">Story: the house deposit</h2>
<ul>
<li>A mother and daughter in Kent were <strong>buying a home</strong>.</li>
<li>An email, apparently from their solicitor, asked them to send the <strong>10% deposit</strong> to a different bank account.</li>
<li>They paid. The email had come from an address <strong>very slightly different</strong> from the solicitor's usual one.</li>
<li><strong>Lost:</strong> <strong>£113,665</strong>, their life savings.</li>
<li><strong>Missed:</strong> new bank details by email, and a lookalike sender address.</li>
<li><strong>What would have stopped it:</strong> <strong>phoning the solicitor</strong> on a known number before paying.</li>
</ul>
<p><small>Source: Today's Conveyancer, 13 Nov 2017.</small></p>
<div class="more">
<p>Fraudsters often watch email conversations for weeks and strike at the moment a big payment is due. Agree with your solicitor at the start that their bank details will never change by email.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="smishing-how-it-works">Smishing: how it works</h2>
<div class="cols"><div>
<ul>
<li><strong>Phishing by text message</strong></li>
<li>&quot;Your parcel couldn't be delivered. Pay £1.99 to rebook.&quot; or &quot;Your bank has blocked a payment.&quot;</li>
<li>The link goes to a fake site that collects your card details</li>
<li>A few days later, &quot;your bank's fraud team&quot; often calls. <strong>That's the criminals too.</strong></li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>A small fee to release a parcel</li>
<li>A deadline: &quot;returned to sender in 24 hours&quot;</li>
<li>An odd web address</li>
<li>A follow-up call that already knows about the &quot;problem&quot;</li>
</ul>
<p><strong>Do this:</strong> track parcels in the courier's or retailer's own app. Forward scam texts to <strong>7726</strong>, which is free.</p>
</div></div>
<div class="more">
<p>Delivery texts are among the most common scam texts in the UK. Real couriers do send texts, so the giveaway is a request for a fee or for card details.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-bank-text">Story: the bank text</h2>
<ul>
<li>A 60-year-old woman in Hampshire got a <strong>text from &quot;her bank&quot;</strong> asking her to call about a transaction. Her bank often sent texts, so it seemed normal.</li>
<li>The &quot;bank&quot; asked her to <strong>install an app to secure her account</strong>. It gave them control.</li>
<li>She was told <strong>not to hang up and not to tell her family</strong>. Fourteen payments followed.</li>
<li><strong>Lost:</strong> <strong>£64,000</strong>, her life savings. More than two-thirds was later refunded.</li>
<li><strong>Missed:</strong> a text asking her to call a number, then a request to install an app.</li>
<li><strong>What would have stopped it:</strong> calling the number on her card, or <strong>159</strong>.</li>
</ul>
<p><small>Source: Which?, 15 Sep 2021.</small></p>
<div class="more">
<p>The scam began with a text, but the theft happened on the phone. Being told to keep it secret, even from family, is a major warning sign. It was a family member who finally helped her realise.</p>
</div>
<footer>Online safety · all examples are fictional</footer>

<h2 id="hi-mum-how-it-works">&quot;Hi Mum&quot;: how it works</h2>
<div class="cols"><div>
<ul>
<li>A message from an <strong>unknown number</strong>: &quot;Hi Mum, I've broken my phone, this is my new number&quot;</li>
<li>Soon comes a request for money for a bill or a new phone, often paid to someone else's account</li>
<li>Some now include a <strong>voice note</strong> that sounds like your child</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>A new number claiming to be family</li>
<li>Money is asked for quickly</li>
<li>A reason why they can't talk on the phone</li>
<li>Payment to an account in someone else's name</li>
</ul>
<p><strong>Do this:</strong> <strong>call them on the number you already have.</strong> Ask something only they would know.</p>
</div></div>
<div class="more">
<p>Anyone can fall for this, because it plays on wanting to help someone you love. In the UK, hundreds of thousands of pounds a year are lost to it.</p>
</div>
<footer>Online safety · all examples are fictional</footer>

<h2 id="story-i-felt-stupid-and-embarrassed">Story: &quot;I felt stupid and embarrassed&quot;</h2>
<ul>
<li>A mother got a message: her daughter had <strong>lost her phone</strong> and had a <strong>new number</strong>.</li>
<li>The &quot;daughter&quot; needed <strong>£1,600</strong> for a work invoice due that day. She often borrowed money, so it felt normal.</li>
<li>The mother paid <strong>someone else's account</strong>. When she called the new number, nobody answered.</li>
<li>She rang her daughter's <strong>old number</strong>. Her daughter hadn't sent anything.</li>
<li><strong>Lost:</strong> <strong>£1,600</strong>. The bank couldn't refund it.</li>

<h2 id="code-theft-how-it-works">Code theft: how it works</h2>
<div class="cols"><div>
<ul>
<li>A criminal tries to sign in to <strong>your</strong> account, which makes WhatsApp or your bank text <strong>you</strong> a code</li>
<li>Then a message arrives, often from a friend's hacked account: &quot;Sorry, I sent my code to you by mistake, can you send it back?&quot;</li>
<li>If you send it, <strong>they take over your account</strong> and ask your contacts for money</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>A code you didn't ask for</li>
<li><strong>Anyone</strong> asking you to pass on a code, even a friend</li>
</ul>
<p><strong>Do this:</strong> <strong>never share a code.</strong> Turn on two-step verification in WhatsApp:<br />
Settings &gt; Account &gt; Two-step verification.</p>
</div></div>
<div class="more">
<p>The code is a key to your account. No genuine company or friend needs it. Once the criminals are in, they often set their own PIN so you can't get back in.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-group-chat-code">Story: the group-chat code</h2>
<ul>
<li>A 56-year-old man got a WhatsApp message from a <strong>friend of 50 years</strong>.</li>
<li>The friend said a payment of <strong>£800</strong> wasn't working, and asked him to pay it instead, to be repaid tomorrow.</li>
<li>He paid. But his friend's account had been <strong>taken over</strong>. Criminals often do this by tricking people into sharing a <strong>code</strong>.</li>
<li><strong>Lost:</strong> <strong>£800</strong></li>
<li><strong>Missed:</strong> a money request by message, even from a real contact's account</li>
<li><strong>What would have stopped it:</strong> <strong>calling his friend</strong> before paying</li>
</ul>
<p><small>Source: Accrington Observer and Yahoo News, May 2024.</small></p>
<div class="more">
<p>Code theft hurts twice. You lose your account, and then your friends are targeted in your name. Turning on two-step verification protects both you and your contacts.</p>

<h2 id="phone-scams-and-voice-cloning-how-they-work">Phone scams and voice cloning: how they work</h2>
<div class="cols"><div>
<ul>
<li>A caller says they're from <strong>your bank's fraud team</strong> or <strong>the police</strong></li>
<li>&quot;Your money is at risk. Move it to a <strong>safe account</strong>.&quot; That account belongs to the criminals.</li>
<li>The number on your screen can be faked</li>
<li>AI can <strong>clone a voice</strong> from a few seconds of video posted online</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>&quot;Safe account&quot;: <strong>a bank or the police will never ask you to move money</strong></li>
<li>Pressure, and being told not to tell anyone</li>
<li>A familiar voice asking for money in an emergency</li>
</ul>
<p><strong>Do this:</strong> hang up. Call <strong>159</strong> to reach your bank, or a number you know, ideally from another phone. Agree a <strong>family safe phrase</strong>.</p>
</div></div>
<div class="more">
<p>To be safe, wait a minute before calling back, or use a different phone. A safe phrase is a word only your family knows, which a cloned voice can't produce.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-fake-police-officer">Story: the fake police officer</h2>
<ul>
<li>An 85-year-old woman got a call from &quot;<strong>the police</strong>&quot;: her card had been cloned.</li>
<li>She was told <strong>not to contact her bank or tell anyone</strong>.</li>
<li>They persuaded her to <strong>buy gold bars</strong> as &quot;evidence&quot;. A fake undercover officer collected them.</li>
<li>Over <strong>five months</strong>, she made eight purchases.</li>
<li><strong>Lost:</strong> <strong>£188,000</strong></li>
<li><strong>Missed:</strong> &quot;police&quot; telling her to keep it from her bank, and asking for valuables</li>
<li><strong>What would have stopped it:</strong> knowing that <strong>police never ask you to move money or hand over valuables</strong>, and hanging up to call <strong>101</strong>.</li>
</ul>
<p><small>Source: Lloyds Bank, 25 Aug 2026.</small></p>
<div class="more">
<p>&quot;Keep this secret&quot; and &quot;don't tell your bank&quot; are always signs of a scam. Real police will never ask you to buy gold, withdraw cash or move money.</p>
</div>

<h2 id="quishing-how-it-works">Quishing: how it works</h2>
<div class="cols"><div>
<ul>
<li><strong>Phishing with a QR code</strong></li>
<li>Fake QR stickers are put over real ones on <strong>parking meters</strong> and signs, or sent in<br />
<strong>emails</strong></li>
<li>Scanning one opens a fake payment page that steals your card details</li>
<li>You may get a parking fine as well, because you never actually paid</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li>A QR code that's a sticker, or looks tampered with</li>
<li>A car park whose operator says it doesn't use QR codes</li>
<li>A QR code in an email asking you to sign in</li>
</ul>
<p><strong>Do this:</strong> pay with the operator's <strong>official app</strong>, a card or cash.</p>
</div></div>
<div class="more">
<p>QR codes in pubs and restaurants are usually fine. Be most careful when a code asks for payment or a login.</p>
</div>
<footer>Online safety · all examples are fictional</footer>

<h2 id="tech-support-pop-ups-how-they-work">Tech-support pop-ups: how they work</h2>
<div class="cols"><div>
<ul>
<li>A pop-up says <strong>&quot;Your computer is infected. Call Microsoft now.&quot;</strong></li>
<li>Or a cold call from &quot;BT&quot;, &quot;Amazon&quot; or &quot;Microsoft&quot; about a problem</li>
<li>The &quot;technician&quot; asks you to install <strong>remote-access software</strong></li>
<li>Then they use it to get into your online banking</li>
</ul>
</div><div>
<p><strong>Warning signs</strong></p>
<ul>
<li><strong>A warning with a phone number on it.</strong> Real Microsoft warnings never have one.</li>
<li>Being asked to install TeamViewer, AnyDesk or similar</li>
<li>Contact about a problem you didn't report</li>
</ul>
<p><strong>Do this:</strong> don't call. Close the browser, or restart if it won't close. <strong>Never give remote access</strong> to someone you didn't contact yourself.</p>
</div></div>
<div class="more">
<p>If you've already given access, switch off the device and the Wi-Fi, then call your bank.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<h2 id="story-the-bt-engineer">Story: the &quot;BT engineer&quot;</h2>
<ul>
<li>A woman with <strong>slow broadband</strong> got a call from a &quot;<strong>BT engineer</strong>&quot;.</li>
<li>He showed her &quot;error messages&quot; proving a security breach, and had her <strong>install remote-access software</strong> to fix it.</li>
<li>She <strong>logged into her bank</strong> so he could &quot;check&quot; her money, and passed on her security codes.</li>
<li><strong>Lost:</strong> <strong>£80,000</strong>, which her bank eventually refunded.</li>
<li><strong>Missed:</strong> an unexpected call, and a request for remote access.</li>
<li><strong>What would have stopped it:</strong> <strong>hanging up and calling BT</strong> on its official number. Never giving remote access.</li>
</ul>
<p><small>Source: Which?, Nov 2020.</small></p>
<div class="more">
<p>The call matched a real problem she was having, which made it believable. Remote access lets criminals see and control everything on your screen, including your banking.</p>
</div>
<footer>Online safety · all examples are fictional</footer>
</section>

<p><strong>Fake</strong> <em>(TRAINING EXAMPLE)</em>: a cold call after a real problem</p>
<blockquote>
<p>&quot;Hi, this is Larkholt Broadband's technical team. We've seen your line dropping out<br />
this week ①. I'll need to connect to your computer to reset the router; just<br />
install the support app I'm sending ②. Then log in to your banking so we can check<br />
the refund goes through ③.&quot;</p>
</blockquote>
<p><strong>Real</strong> <em>(TRAINING EXAMPLE)</em>: an alert from your own security software</p>
<blockquote>
<p>Threat found and removed. No action needed. You can see details in your security<br />
app.</p>
</blockquote>

<h2 id="what-they-all-want">What they all want</h2>
<ul>
<li><strong>Your details:</strong> passwords and card numbers, through fake emails, texts and QR codes</li>
<li><strong>Your money:</strong> through &quot;safe accounts&quot;, &quot;Hi Mum&quot; and changed bank details</li>
<li><strong>Your accounts and devices:</strong> through stolen codes and remote access</li>
</ul>
<div class="more">
<p>New scams appear all the time, but they almost always want one of these three things.<br />
Spotting which one is being asked for is often enough to stop a scam.</p>
</div>

<h2 id="rules-that-beat-every-trick">Rules that beat every trick</h2>
<ol>
<li><strong>Stop and check.</strong> Urgency is the criminal's best tool.</li>
<li><strong>Call back on a number you know.</strong> Never use one they gave you.</li>
<li><strong>Never share a code.</strong></li>
<li><strong>Never move money to a &quot;safe account&quot;.</strong></li>
<li><strong>Go direct.</strong> Use the official app or type the website address yourself.</li>
</ol>
<div class="more">
<p>None of these rules needs technical knowledge. If something feels wrong, it's always fine to say no and check.</p>
</div>
<footer>Online safety · all examples are fictional</footer>

<h2 id="question-5-of-5-spot-the-phish">Question 5 of 5: spot the phish</h2>
<p><em>(TRAINING EXAMPLE)</em> A message arrives from an unknown number:</p>
<blockquote>
<p>Hi Mum, new number, my old phone broke. Give me a ring on this one so you know it's<br />
me x</p>
</blockquote>
<p>Is this message a scam?</p>
<ul>
<li>A. Yes. Any new number is a scam.</li>
<li>B. Probably not. It asks for no money and invites a call, but ring to check.</li>
<li>C. Yes. It's asking you to call a premium-rate number.</li>
<li>D. No. It's definitely safe, so just save the number.</li>
</ul>

<h2 id="answer-5">Answer 5</h2>
<p><strong>B. Probably not, but ring to check.</strong></p>
<ul>
<li>Genuine messages like this exist. The safe sign is that it <strong>asks you to call</strong> and asks for no money.</li>
<li>Ringing confirms who it is. Ringing your child's <strong>old</strong> number is even better.</li>
<li>Never assume a message is safe just because it doesn't ask for money yet.</li>
</ul>
